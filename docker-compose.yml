# 50 gluetun (PIA) tunnels behind the Go proxy. endpoints.json lists each one
# 1:1: the endpoint name equals SERVER_REGIONS and its port equals the host
# port published here. endpoints_test.go checks this, so run `go test ./...`
# after any change to either file.
#
# Ports bind to 127.0.0.1 only. The Go proxy and the VPS monitors are the
# only callers, and nothing outside the host may use a tunnel directly.

x-gluetun: &gluetun
  image: qmcgaw/gluetun
  cap_add:
    - NET_ADMIN
  restart: unless-stopped
  mem_limit: 256m
  memswap_limit: 256m
  cpus: 0.50
  init: true
  healthcheck:
    interval: 5m
    timeout: 30s
    start_period: 40s
    retries: 3

x-pia-env: &pia-env
  VPN_SERVICE_PROVIDER: private internet access
  OPENVPN_USER: ${PIA_USERNAME}
  OPENVPN_PASSWORD: ${PIA_PASSWORD}
  FIREWALL_OUTBOUND_SUBNETS: 172.22.0.0/16
  HTTPPROXY: "on"

services:

  # PIA VPN - US Florida (Miami)
  vpn-florida:
    <<: *gluetun
    container_name: vpn-florida
    environment:
      <<: *pia-env
      SERVER_REGIONS: US Florida
    networks:
      vpn_network:
        ipv4_address: 172.22.0.10
    ports:
      - "127.0.0.1:8881:8888"

  # PIA VPN - US California
